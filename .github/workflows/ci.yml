name: CI

on:
  pull_request:
    branches: [dev, main]
  # dev는 PR 없이 push할 수 있어서, push 후에도 빌드해 깨지면 알려준다 (막지는 않음)
  push:
    branches: [dev]

jobs:
  # PR에서 바뀐 서비스 목록을 만든다. 예: ["auth", "gateway"]
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      frontend: ${{ steps.fe.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: 'auth/**'
            user: 'user/**'
            order: 'order/**'
            gateway: 'gateway/**'
      # frontend는 Gradle이 아니라서 위 matrix에 넣지 않고 따로 본다
      - uses: dorny/paths-filter@v3
        id: fe
        with:
          filters: |
            frontend: ['frontend/**', '.github/workflows/ci.yml']

  # 바뀐 서비스마다 job을 하나씩 띄워 빌드하고 테스트한다.
  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck # 포맷이 틀리면 여기서 실패 (고치기: ./gradlew spotlessApply)
      - run: ./gradlew build # 컴파일 + 테스트 + jar

  # 개발용 화면. 바뀌었을 때만 테스트와 빌드(타입 검사 포함)를 돌린다.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # 브랜치 보호의 필수 체크용. build는 matrix라 이름이 바뀌고 skip되기도 해서, 항상 도는 job 하나로 결과를 모은다.
  # build가 하나라도 실패·취소되면 실패, 바뀐 서비스가 없어 skip되면 성공.
  ci-result:
    needs: [changes, build, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "CI 통과"

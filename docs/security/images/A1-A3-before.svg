<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d33"/></marker>
  </defs>
<rect width="780" height="600" fill="#fff"/>
  <text x="20" y="36" font-size="20" font-weight="700" fill="#d33">고치기 전</text>

  <!-- client -->
  <rect x="230" y="20" width="300" height="56" rx="8" fill="#f5f6f8" stroke="#555"/>
  <text x="380" y="43" font-size="15" font-weight="700" text-anchor="middle" fill="#222">클라이언트 (토큰 없음)</text>
  <text x="380" y="64" font-size="13" text-anchor="middle" fill="#d33">X-User-WorkType: 본사 (위조)</text>

  <!-- gateway container -->
  <rect x="40" y="104" width="540" height="306" rx="10" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="54" y="126" font-size="14" font-weight="700" fill="#666">gateway</text>

  <line x1="380" y1="76" x2="380" y2="138" stroke="#d33" stroke-width="2" marker-end="url(#r)"/>

  <rect x="230" y="140" width="300" height="52" rx="8" fill="#f5f6f8" stroke="#555"/>
  <text x="380" y="161" font-size="14" font-weight="700" text-anchor="middle" fill="#222">SecurityConfig</text>
  <text x="380" y="181" font-size="13" text-anchor="middle" fill="#d33">/user/**, /order/** = permitAll</text>

  <line x1="380" y1="192" x2="380" y2="233" stroke="#d33" stroke-width="2" marker-end="url(#r)"/>
  <text x="390" y="218" font-size="13" font-weight="700" fill="#d33">A2: 토큰 없어도 통과</text>

  <rect x="230" y="235" width="300" height="46" rx="8" fill="#f5f6f8" stroke="#555"/>
  <text x="380" y="263" font-size="14" font-weight="700" text-anchor="middle" fill="#222">JwtClaimsHeaderFilter: 토큰 있나?</text>

  <path d="M380,281 V300 H185 V318" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="195" y="314" font-size="13" fill="#555">있음</text>
  <path d="M380,300 H450 V318" fill="none" stroke="#d33" stroke-width="2" marker-end="url(#r)"/>
  <text x="460" y="314" font-size="13" font-weight="700" fill="#d33">없음</text>

  <rect x="60" y="320" width="250" height="74" rx="8" fill="#f5f6f8" stroke="#555"/>
  <text x="185" y="342" font-size="13" text-anchor="middle" fill="#222">토큰 검증 (실패 시 401)</text>
  <text x="185" y="362" font-size="13" text-anchor="middle" fill="#222">성공 → X-User-* 5개만 덮어씀</text>
  <text x="185" y="382" font-size="12" text-anchor="middle" fill="#666">X-User-Role 같은 다른 이름은 남음</text>

  <rect x="340" y="320" width="220" height="74" rx="8" fill="#fde2e2" stroke="#d33" stroke-width="2"/>
  <text x="450" y="350" font-size="14" font-weight="700" text-anchor="middle" fill="#b22">검사 안 함</text>
  <text x="450" y="372" font-size="13" text-anchor="middle" fill="#b22">A1: 위조 헤더 그대로 통과</text>

  <!-- services -->
  <path d="M185,394 V424 H310 V452" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="394" x2="450" y2="452" stroke="#d33" stroke-width="2" marker-end="url(#r)"/>

  <rect x="230" y="454" width="300" height="56" rx="8" fill="#f5f6f8" stroke="#555"/>
  <text x="380" y="477" font-size="15" font-weight="700" text-anchor="middle" fill="#222">user / order</text>
  <text x="380" y="498" font-size="13" text-anchor="middle" fill="#222">X-User-* 헤더를 그대로 믿음</text>

  <line x1="380" y1="510" x2="380" y2="536" stroke="#d33" stroke-width="2" marker-end="url(#r)"/>
  <rect x="210" y="538" width="340" height="44" rx="8" fill="#fde2e2" stroke="#d33" stroke-width="2"/>
  <text x="380" y="566" font-size="14" font-weight="700" text-anchor="middle" fill="#b22">200 "본사" · 전체 직원 정보 노출</text>

  <!-- A3 bypass -->
  <path d="M530,48 H650 V482 H534" fill="none" stroke="#d33" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="662" y="240" font-size="13" font-weight="700" fill="#d33">A3</text>
  <text x="662" y="260" font-size="13" fill="#d33">포트 8082로</text>
  <text x="662" y="278" font-size="13" fill="#d33">gateway 건너뜀</text>
  <text x="662" y="296" font-size="12" fill="#888">(로컬 compose)</text>
</svg>

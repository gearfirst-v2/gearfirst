# 로컬용 user 설정. 원본: Gear-First/GitOps user/user-configmap.yaml
server:
  shutdown: graceful
  servlet:
    context-path: /user

auth-service:
  url: ${AUTH_SERVICE_URL}
  # auth에서 서비스 토큰(client credentials)을 받을 때 쓰는 비밀값. 값은 infra/.env에만 둔다 (GEA-13)
  client-secret: ${USER_SERVICE_CLIENT_SECRET}

# 첫 본사 계정 (GEA-15). 본사 팀장이 0명일 때만 이 이메일로 만들고, 임시 비밀번호는 개인 메일로 보낸다. 비우면 만들지 않는다
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    personal-email: ${BOOTSTRAP_ADMIN_PERSONAL_EMAIL:}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://postgres:5432/userdb
    username: user_app
    password: ${DB_PASSWORD}
  jpa:
    # 테이블을 만든 뒤에 기초 데이터(user-seed.sql)를 넣는다
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: file:/config/user-seed.sql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.use.type.headers: false
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: MANUAL_IMMEDIATE

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

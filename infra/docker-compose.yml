name: gearfirst

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # 데이터가 비어 있을 때(첫 실행)만 실행됨. 바꾸면 docker compose down -v 후 다시 up
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: 다른 컨테이너용(kafka:9092), HOST: 인텔리제이에서 직접 실행할 때용(localhost:29092)
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      # 9092는 다른 프로젝트(bukang-kafka)가 사용 중이라 호스트에는 29092만 연다
      - "29092:29092"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025" # SMTP (서비스가 메일을 보내는 곳)
      - "8025:8025" # 받은 메일을 보는 웹 화면

  auth:
    build: ../auth
    environment:
      # 운영에서 ConfigMap을 마운트하던 방식 그대로 설정 파일을 주입
      SPRING_CONFIG_LOCATION: file:/config/application.yml
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 최종적으로 브라우저는 gateway(8080)를 거쳐 auth에 접속한다
      AUTH_ISSUER: http://localhost:8080/auth
      USER_SERVICE_URL: http://user:8080/user
      USER_SERVICE_CLIENT_SECRET: ${USER_SERVICE_CLIENT_SECRET}
    volumes:
      - ./config/auth.yml:/config/application.yml:ro
    # 호스트 포트를 열지 않는다. 운영(ClusterIP)처럼 gateway를 거쳐서만 접근해야 gateway 검사를 우회할 수 없다
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  user:
    build: ../user
    environment:
      SPRING_CONFIG_LOCATION: file:/config/application.yml
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth:8080/auth
      USER_SERVICE_CLIENT_SECRET: ${USER_SERVICE_CLIENT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PERSONAL_EMAIL: ${BOOTSTRAP_ADMIN_PERSONAL_EMAIL:-}
    volumes:
      - ./config/user.yml:/config/application.yml:ro
      - ./config/user-seed.sql:/config/user-seed.sql:ro
    # 호스트 포트를 열지 않는다 (auth와 같은 이유)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  order:
    build: ../order
    environment:
      SPRING_CONFIG_LOCATION: file:/config/application.yml
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAREHOUSE_URL: http://warehouse:8080/warehouse # 로컬에는 없는 서비스
    volumes:
      - ./config/order.yml:/config/application.yml:ro
    # 호스트 포트를 열지 않는다 (auth와 같은 이유)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    build: ../gateway
    environment:
      SPRING_CONFIG_LOCATION: file:/config/application.yml
      AUTH_JWK_SET_URI: http://auth:8080/auth/oauth2/jwks
    volumes:
      - ./config/gateway.yml:/config/application.yml:ro
    ports:
      - "8080:8080" # 브라우저·프론트는 이 주소 하나로 모든 서비스에 접속
    depends_on:
      - auth
      - user
      - order

volumes:
  pgdata:

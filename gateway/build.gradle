plugins {
	id 'java'
	id 'com.diffplug.spotless' version '8.0.0'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gearfirst'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
    // LoadBalancer (게이트웨이가 각 서비스로 라우팅할 때 필요)
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client-loadbalancer'
    // 헬스체크 / 모니터링
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //  Kubernetes 연동
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-kubernetes-client-config'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //  Spring Security (Reactive)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    //  Reactive JWT Decoder (Nimbus)
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    //  Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    //  Reactor Core (Mono/Flux)
    implementation 'io.projectreactor:reactor-core'
    // Spring Cloud Gateway (WebFlux 기반)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// 포맷 규칙: palantir-java-format. 커밋 전 ./gradlew spotlessApply, CI는 spotlessCheck로 검사한다.
spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
